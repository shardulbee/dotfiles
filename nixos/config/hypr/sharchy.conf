$mainMod = SUPER

monitor = eDP-1,2560x1600@120,0x0,2

env = NIXOS_OZONE_WL,1
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

exec-once = systemctl --user start noctalia.service
exec-once = swaybg -c '#ebe6da'
exec-once = lxqt-policykit-agent
exec-once = swayidle -w timeout 300 "swaylock -f -c 272727" timeout 600 "hyprctl dispatch dpms off" resume "hyprctl dispatch dpms on" before-sleep "swaylock -f -c 272727"

input {
  kb_options = ctrl:nocaps
  repeat_delay = 260
  repeat_rate = 60
  follow_mouse = 1
  touchpad {
    natural_scroll = true
    tap-to-click = true
  }
}

general {
  gaps_in = 2
  gaps_out = 4
  border_size = 2
  col.active_border = rgb(007acc)
  col.inactive_border = rgb(d8d0c4)
  layout = dwindle
}

decoration {
  rounding = 10
  shadow {
    enabled = false
  }
  blur {
    enabled = false
  }
}

animations {
  enabled = false
}

dwindle {
  preserve_split = true
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
}

debug {
  vfr = true
}

gesture = 3, horizontal, workspace

bind = $mainMod, RETURN, exec, ghostty
bind = $mainMod, SPACE, exec, noctalia msg panel-toggle launcher
bind = $mainMod SHIFT, B, exec, helium
bind = $mainMod, P, exec, 1password --quick-access
bind = $mainMod CTRL, T, exec, /home/shardul/.local/bin/sharchy-theme toggle
bind = $mainMod ALT, K, exec, /home/shardul/.local/bin/sharchy-keybindings
bind = $mainMod, ESCAPE, exec, sh -lc 'noctalia msg session lock || swaylock -f -c 272727'
bind = ALT, Q, killactive
bind = ALT, TAB, workspace, previous

bind = ALT, C, exec, /home/shardul/.local/bin/sharchy-key copy
bind = ALT, V, exec, /home/shardul/.local/bin/sharchy-key paste
bind = ALT, A, exec, /home/shardul/.local/bin/sharchy-key select-all
bind = $mainMod, A, exec, /home/shardul/.local/bin/sharchy-key select-all
bind = $mainMod, X, exec, /home/shardul/.local/bin/sharchy-key cut
bind = $mainMod, Z, exec, /home/shardul/.local/bin/sharchy-key undo
bind = $mainMod SHIFT, Z, exec, /home/shardul/.local/bin/sharchy-key redo
bind = $mainMod, LEFT, exec, /home/shardul/.local/bin/sharchy-key prev-word
bind = $mainMod, RIGHT, exec, /home/shardul/.local/bin/sharchy-key next-word
bind = $mainMod SHIFT, LEFT, exec, /home/shardul/.local/bin/sharchy-key select-prev-word
bind = $mainMod SHIFT, RIGHT, exec, /home/shardul/.local/bin/sharchy-key select-next-word
bind = $mainMod, BACKSPACE, exec, /home/shardul/.local/bin/sharchy-key delete-prev-word
bind = ALT, BACKSPACE, exec, /home/shardul/.local/bin/sharchy-key delete-prev-word

bind = ALT, L, exec, /home/shardul/.local/bin/sharchy-key browser ctrl l alt l
bind = ALT, COMMA, exec, /home/shardul/.local/bin/sharchy-key browser ctrl comma alt comma
bind = ALT, F, exec, /home/shardul/.local/bin/sharchy-key browser ctrl f alt f
bind = ALT, T, exec, /home/shardul/.local/bin/sharchy-key browser ctrl t alt t
bind = ALT, W, exec, /home/shardul/.local/bin/sharchy-key close
# Match the physical bracket keys; with Shift held their keysyms become braces.
bind = ALT SHIFT, code:34, exec, /home/shardul/.local/bin/sharchy-key browser 'ctrl shift' Tab 'alt shift' bracketleft
bind = ALT SHIFT, code:35, exec, /home/shardul/.local/bin/sharchy-key browser ctrl Tab 'alt shift' bracketright
bind = ALT, bracketleft, exec, /home/shardul/.local/bin/sharchy-key browser alt Left alt bracketleft
bind = ALT, bracketright, exec, /home/shardul/.local/bin/sharchy-key browser alt Right alt bracketright
bind = ALT, R, exec, /home/shardul/.local/bin/sharchy-key browser ctrl r alt r
bind = ALT SHIFT, R, exec, /home/shardul/.local/bin/sharchy-key browser 'ctrl shift' r 'alt shift' r
bind = ALT SHIFT, T, exec, /home/shardul/.local/bin/sharchy-key browser 'ctrl shift' t 'alt shift' t
bind = ALT, 1, exec, /home/shardul/.local/bin/sharchy-key browser ctrl 1 alt 1
bind = ALT, 2, exec, /home/shardul/.local/bin/sharchy-key browser ctrl 2 alt 2
bind = ALT, 3, exec, /home/shardul/.local/bin/sharchy-key browser ctrl 3 alt 3
bind = ALT, 4, exec, /home/shardul/.local/bin/sharchy-key browser ctrl 4 alt 4
bind = ALT, 5, exec, /home/shardul/.local/bin/sharchy-key browser ctrl 5 alt 5
bind = ALT, 6, exec, /home/shardul/.local/bin/sharchy-key browser ctrl 6 alt 6
bind = ALT, 7, exec, /home/shardul/.local/bin/sharchy-key browser ctrl 7 alt 7
bind = ALT, 8, exec, /home/shardul/.local/bin/sharchy-key browser ctrl 8 alt 8
bind = ALT, 9, exec, /home/shardul/.local/bin/sharchy-key browser ctrl 9 alt 9
bind = ALT, N, exec, /home/shardul/.local/bin/sharchy-key browser ctrl n alt n
bind = ALT SHIFT, N, exec, /home/shardul/.local/bin/sharchy-key browser 'ctrl shift' n 'alt shift' n
bind = ALT, D, exec, /home/shardul/.local/bin/sharchy-key browser ctrl d alt d
bind = ALT, P, exec, /home/shardul/.local/bin/sharchy-key browser ctrl p alt p
bind = ALT, S, exec, /home/shardul/.local/bin/sharchy-key browser ctrl s alt s
bind = ALT, O, exec, /home/shardul/.local/bin/sharchy-key browser ctrl o alt o
bind = ALT, J, exec, /home/shardul/.local/bin/sharchy-key browser ctrl j alt j
bind = ALT, Y, exec, /home/shardul/.local/bin/sharchy-key browser ctrl h alt y
bind = ALT, EQUAL, exec, /home/shardul/.local/bin/sharchy-key browser ctrl equal alt equal
bind = ALT, MINUS, exec, /home/shardul/.local/bin/sharchy-key browser ctrl minus alt minus
bind = ALT, 0, exec, /home/shardul/.local/bin/sharchy-key browser ctrl 0 alt 0

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, MINUS, resizeactive, -100 0
bind = $mainMod, EQUAL, resizeactive, 100 0
bind = $mainMod SHIFT, MINUS, resizeactive, 0 -100
bind = $mainMod SHIFT, EQUAL, resizeactive, 0 100
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, R, layoutmsg, togglesplit

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = ALT SHIFT, 3, exec, noctalia msg screenshot-region
bind = ALT SHIFT, 4, exec, noctalia msg screenshot-fullscreen all
bind = , PRINT, exec, noctalia msg screenshot-region
bind = CTRL, PRINT, exec, noctalia msg screenshot-fullscreen all
bind = ALT, PRINT, exec, noctalia msg screenshot-fullscreen

windowrule {
  name = suppress-maximize
  match:class = .*
  suppress_event = maximize
}
