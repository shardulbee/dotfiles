name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Join tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID }}
          audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          tags: tag:dotfiles-deploy

      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/dotfiles-deploy
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/dotfiles-deploy
          ssh=(ssh -i ~/.ssh/dotfiles-deploy -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          git archive "$GITHUB_SHA" | "${ssh[@]}" dotfiles-deploy@turbogadget "deploy $GITHUB_SHA"
