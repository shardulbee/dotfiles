$mainMod = SUPER

monitor = eDP-1,2560x1600@120,0x0,2

env = NIXOS_OZONE_WL,1
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_THEME,macOS
env = XCURSOR_SIZE,24

exec-once = systemctl --user start sharchy-bar.service mako.service
exec-once = 1password --silent
exec-once = obsidian
exec-once = swayidle -w timeout 300 "systemctl --user start sharchy-lock.service" timeout 600 "hyprctl dispatch dpms off" resume "hyprctl dispatch dpms on" before-sleep "systemctl --user start sharchy-lock.service"

input {
  kb_options = ctrl:nocaps
  repeat_delay = 260
  repeat_rate = 60
  follow_mouse = 1
  touchpad {
    natural_scroll = true
    tap-to-click = true
    scroll_factor = 0.3
  }
}

general {
  gaps_in = 2
  gaps_out = 4
  border_size = 2
  col.active_border = rgb(cd974b)
  col.inactive_border = rgb(5c584c)
  layout = dwindle
}

decoration {
  rounding = 10
  shadow {
    enabled = false
  }
  blur {
    enabled = false
  }
}

animations {
  enabled = false
}

dwindle {
  preserve_split = true
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
}

debug {
  vfr = true
}

gesture = 3, horizontal, workspace

bind = $mainMod, RETURN, exec, ghostty
bind = ALT, SPACE, exec, /home/shardul/.local/bin/sharchy-fuzzel
bind = $mainMod SHIFT, RETURN, exec, /home/shardul/.local/bin/sharchy-helium
bind = $mainMod SHIFT, B, exec, /home/shardul/.local/bin/sharchy-helium
bind = $mainMod, P, exec, 1password --quick-access
bind = $mainMod SHIFT, P, exec, 1password --show
bind = $mainMod CTRL, T, exec, /home/shardul/.local/bin/sharchy-theme toggle
bind = $mainMod ALT, K, exec, /home/shardul/.local/bin/sharchy-keybindings
bind = $mainMod ALT, R, exec, /home/shardul/.local/bin/sharchy-rebuild
bind = $mainMod ALT, S, exec, /home/shardul/.local/bin/sharchy-layout-toggle
bind = $mainMod, ESCAPE, exec, systemctl --user start sharchy-lock.service
bind = $mainMod, N, workspace, name:obsidian
bind = $mainMod, TAB, workspace, previous
bind = $mainMod, Q, killactive
bind = ALT, TAB, workspace, previous

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, MINUS, resizeactive, -100 0
bind = $mainMod, EQUAL, resizeactive, 100 0
bind = $mainMod SHIFT, MINUS, resizeactive, 0 -100
bind = $mainMod SHIFT, EQUAL, resizeactive, 0 100
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, R, layoutmsg, togglesplit

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = ALT SHIFT, 3, exec, /home/shardul/.local/bin/sharchy-screenshot region
bind = ALT SHIFT, 4, exec, /home/shardul/.local/bin/sharchy-screenshot fullscreen
bind = , PRINT, exec, /home/shardul/.local/bin/sharchy-screenshot region
bind = CTRL, PRINT, exec, /home/shardul/.local/bin/sharchy-screenshot fullscreen

windowrule {
  name = obsidian-space
  match:class = (?i).*obsidian.*
  workspace = name:obsidian
  fullscreen = on
}

windowrule {
  name = float-1password
  match:class = 1password
  float = on
  center = on
  size = 900 650
}

windowrule {
  name = suppress-maximize
  match:class = .*
  suppress_event = maximize
}
