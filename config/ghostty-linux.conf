theme = dark:Alabaster Dark,light:Alabaster Light

# Font
font-family = "JetBrainsMono Nerd Font"
font-style = Regular
font-size = 12

# Window
window-theme = ghostty
window-padding-x = 14
window-padding-y = 14
confirm-close-surface=false
resize-overlay = never
gtk-toolbar-style = flat

# Cursor styling
cursor-style = "block"
cursor-style-blink = false

# Cursor styling + SSH session terminfo
# (all shell integration options must be passed together)
shell-integration-features = no-cursor,ssh-env

# Keyboard bindings
keybind = shift+insert=paste_from_clipboard
keybind = control+insert=copy_to_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
keybind = shift+enter=csi:13;2u
# Legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
keybind = alt+shift+enter=csi:13;4u
keybind = super+control+shift+alt+arrow_down=resize_split:down,100
keybind = super+control+shift+alt+arrow_up=resize_split:up,100
keybind = super+control+shift+alt+arrow_left=resize_split:left,100
keybind = super+control+shift+alt+arrow_right=resize_split:right,100

# Slowdown mouse scrolling
mouse-scroll-multiplier = 0.95

# Avoid Wayland rendering latency (https://github.com/ghostty-org/ghostty/discussions/3224)
async-backend = epoll

# Alt aliases for Ghostty's Ctrl+Shift shortcuts. This keeps terminal control
# codes free while making terminal chrome feel more Mac-like.
keybind = alt+,=reload_config
keybind = alt+c=copy_to_clipboard
keybind = alt+v=paste_from_clipboard
keybind = alt+j=write_screen_file:paste,plain
keybind = alt+n=new_window
keybind = alt+w=close_surface
keybind = alt+q=quit
keybind = alt+t=new_tab
keybind = alt+shift+[=previous_tab
keybind = alt+shift+]=next_tab
keybind = alt+[=goto_split:previous
keybind = alt+]=goto_split:next
keybind = alt+o=new_split:right
keybind = alt+e=new_split:down
keybind = alt+d=new_split:right
keybind = alt+page_up=jump_to_prompt:-1
keybind = alt+page_down=jump_to_prompt:1
keybind = alt+f=start_search
keybind = alt+i=inspector:toggle
keybind = alt+a=select_all
# macOS-style command/option editing for the shell. These encode standard
# terminal control sequences rather than Linux GUI shortcuts.
keybind = alt+x=esc:x
keybind = alt+z=text:\x1f
keybind = alt+backspace=text:\x15
keybind = alt+arrow_left=text:\x01
keybind = alt+arrow_right=text:\x05
keybind = super+backspace=text:\x17
keybind = super+arrow_left=esc:b
keybind = super+arrow_right=esc:f
keybind = super+shift+arrow_left=csi:1;6D
keybind = super+shift+arrow_right=csi:1;6C
keybind = alt+enter=toggle_split_zoom
keybind = alt+p=toggle_command_palette
keybind = alt+==increase_font_size:1
keybind = alt+-=decrease_font_size:1
keybind = alt+0=reset_font_size
