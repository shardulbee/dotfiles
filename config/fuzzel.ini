[main]
font=JetBrainsMono Nerd Font:size=12
use-bold=yes
dpi-aware=auto
prompt="  "
placeholder=Search applications…
icons-enabled=yes
show-actions=yes
terminal=ghostty -e
fields=name,generic,keywords,comment
match-mode=fzf
width=54
lines=9
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=32
layer=overlay
anchor=center
delayed-filter-ms=0

[border]
width=1
radius=14
selection-radius=8
