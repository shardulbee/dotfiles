# Sharchy Sway configuration.
set $mod Mod4
set $left h
set $down j
set $up k
set $right l

output eDP-1 mode 2560x1600@120Hz scale 2

input type:keyboard {
    xkb_options ctrl:nocaps
    repeat_delay 260
    repeat_rate 60
}

input type:touchpad {
    natural_scroll enabled
    tap enabled
    scroll_factor 0.3
}

focus_follows_mouse yes
default_border pixel 2
default_floating_border pixel 2
gaps inner 2
gaps outer 0
client.focused #cd974b #cd974b #26251e #cd974b #cd974b
client.unfocused #5c584c #5c584c #cecece #5c584c #5c584c

# Programs
bindsym $mod+Return exec monstar
bindsym $mod+a exec quickshell -p /home/shardul/.config/quickshell/sharchy ipc call overview toggle
bindsym $mod+space exec vicinae toggle
bindsym Mod1+space exec vicinae toggle
bindsym $mod+c exec vicinae 'vicinae://launch/clipboard/history?toggle=true'
bindsym $mod+Shift+Return exec /home/shardul/.local/bin/sharchy-helium
bindsym $mod+Shift+b exec /home/shardul/.local/bin/sharchy-helium
bindsym $mod+Shift+t exec /home/shardul/.local/bin/sharchy-translate
bindsym $mod+Mod1+p exec 1password --quick-access
bindsym $mod+Ctrl+t exec /home/shardul/.local/bin/sharchy-theme toggle
bindsym $mod+Escape exec systemctl --user start sharchy-lock.service
bindsym $mod+q kill

# Windows and workspaces
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right
bindsym $mod+Tab workspace back_and_forth
bindsym Mod1+Tab workspace back_and_forth

bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# Layout and sizing
bindsym $mod+b splith
bindsym $mod+v splitv
bindsym $mod+r layout toggle split
bindsym $mod+g layout toggle tabbed split
bindsym $mod+minus resize shrink width 100 px
bindsym $mod+equal resize grow width 100 px
bindsym $mod+Shift+minus resize shrink height 100 px
bindsym $mod+Shift+equal resize grow height 100 px
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+f floating toggle

# Hardware
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym --locked XF86MonBrightnessUp exec brightnessctl set +5%
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-

# Capture
bindsym Mod1+Shift+3 exec /home/shardul/.local/bin/sharchy-screenshot region
bindsym Mod1+Shift+4 exec /home/shardul/.local/bin/sharchy-screenshot fullscreen
bindsym Mod1+Shift+5 exec /home/shardul/.local/bin/sharchy-screen-record

# Window rules
for_window [app_id="1[Pp]assword"] floating enable, resize set width 900 px height 650 px, move position center

# Session services
exec systemctl --user start sharchy-bar.service mako.service
exec 1password --silent
exec swayidle -w timeout 300 'systemctl --user start sharchy-lock.service' timeout 600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' before-sleep 'systemctl --user start sharchy-lock.service'

include /etc/sway/config.d/*
